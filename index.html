<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Drum Machine</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #drum-machine {
      width: 400px;
      padding: 30px;
      background: #333;
      border-radius: 15px;
      text-align: center;
    }

    #display {
      background: black;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 20px;
      min-height: 25px;
    }

    #pad-bank {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .drum-pad {
      padding: 30px;
      font-size: 25px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #555;
      color: white;
    }

    .drum-pad:hover {
      background: #777;
    }

    .drum-pad:active {
      transform: scale(0.95);
    }

    .clip {
      display: none;
    }
  </style>
</head>

<body>

  <div id="drum-machine">

    <p id="display">Drum Machine</p>

    <div id="pad-bank">

      <button class="drum-pad" id="heater-1">
        Q
        <audio
          class="clip"
          id="Q"
          src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="heater-2">
        W
        <audio
          class="clip"
          id="W"
          src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="heater-3">
        E
        <audio
          class="clip"
          id="E"
          src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="heater-4">
        A
        <audio
          class="clip"
          id="A"
          src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="clap">
        S
        <audio
          class="clip"
          id="S"
          src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="open-hh">
        D
        <audio
          class="clip"
          id="D"
          src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="kick-n-hat">
        Z
        <audio
          class="clip"
          id="Z"
          src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="kick">
        X
        <audio
          class="clip"
          id="X"
          src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3">
        </audio>
      </button>

      <button class="drum-pad" id="closed-hh">
        C
        <audio
          class="clip"
          id="C"
          src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3">
        </audio>
      </button>

    </div>
  </div>

  <script>
    const drumPads = document.querySelectorAll(".drum-pad");
    const display = document.getElementById("display");

    function playDrum(pad) {
      const audio = pad.querySelector(".clip");

      audio.currentTime = 0;
      audio.play();

      display.textContent = pad.id;
    }

    drumPads.forEach(pad => {
      pad.addEventListener("click", () => {
        playDrum(pad);
      });
    });

    document.addEventListener("keydown", event => {
      const key = event.key.toUpperCase();
      const audio = document.getElementById(key);

      if (audio) {
        playDrum(audio.parentElement);
      }
    });
  </script>

</body>
</html>

This version has all 9 buttons in the required order:

Q → W → E → A → S → D → Z → X → C

and supports both clicking and keyboard presses.
